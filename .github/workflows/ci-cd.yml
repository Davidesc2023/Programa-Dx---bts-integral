name: CI/CD — APP-DX v2.0

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─── Job 1: Calidad Frontend (lint + type-check + tests) ───────────────────
  quality-frontend:
    name: Frontend — Lint + Types + Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Tests unitarios + cobertura
        run: npm test -- --coverage --ci --passWithNoTests
        env:
          NEXT_PUBLIC_BACKEND_URL: http://localhost:3000

  # ─── Job 2: Tests Backend (Deno) ───────────────────────────────────────────
  quality-backend:
    name: Backend — Deno Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: '2.x'

      - name: Tests backend
        run: deno test --allow-net --allow-env supabase/functions/api/_tests/

  # ─── Job 3: Deploy Edge Function → Supabase ────────────────────────────────
  deploy-backend:
    name: Deploy → Supabase Edge Function
    runs-on: ubuntu-latest
    needs: [quality-frontend, quality-backend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy Edge Function
        run: supabase functions deploy api --project-ref wwosggahpasvoexshrdl --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

  # ─── Job 4: Deploy Frontend → Vercel ───────────────────────────────────────
  deploy-frontend:
    name: Deploy → Vercel
    runs-on: ubuntu-latest
    needs: [quality-frontend, quality-backend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Deploy to Vercel (production)
        run: vercel deploy --prod --yes
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
